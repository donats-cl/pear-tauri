[package]
name = "pear-tauri"
version = "0.1.0"
edition = "2021"

# Android/iOS собирают приложение как библиотеку (точка входа — lib.rs, run())
[lib]
name = "pear_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.1.2", features = ["devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
# без native-tls по умолчанию: на Android он требует OpenSSL, а TLS и так через rustls
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "charset", "http2"] }
base64 = "0.22"
discord-rich-presence = "1.1.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }

[build-dependencies]
tauri-build = { version = "2.1.2", features = [] }
